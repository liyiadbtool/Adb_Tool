# ============================================================================
#  adb_send_chinese.ini — 配置文件示例
#  把本文件与 adb_send_chinese.exe 放在同一目录，改完无需重新编译。
#  以 # 或 ; 开头的行为注释。
# ============================================================================

# adb 可执行文件路径（默认用 PATH 里的 adb；路径带空格时请用引号或改这里）
adb=adb

# 设备序列号：只连一台设备留空；连多台必须填（先执行 adb devices 查看）
serial=

# 意图 action 与 URI 前缀（换接口只改这两行）
action=android.intent.action.VIEW
uri_prefix=sr://syncore.vpa.sr/test?text=

# 发送失败后自动重试次数：0 表示不重试
retry=1

# 常用语 1~9：填中文即可，留空表示该编号不可用
quick_1=
quick_2=
quick_3=
quick_4=
quick_5=
quick_6=
quick_7=
quick_8=
quick_9=
