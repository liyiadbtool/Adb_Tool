[cmd.stoffline]
desc = 下线配置：工程模式-离线配置页（SynTestUtil xxpz）
group = SynTestUtil
usage = stoffline
run = shell am start -n com.android.engmode/.ui.OfflineConfigActivity

# ---------------- 网络模拟 ----------------
# 代理三键来自逆向 F-E2；弱网参数沿用 F-E4 的 delay / loss / rate，
# 但按逆向文档 §7 的判断改用设备端 tc netem（需 root），不引入 mitmproxy。

[cmd.stproxyget]
desc = 代理查询：读 global http_proxy
group = 网络模拟
usage = stproxyget
run = shell settings get global http_proxy

[cmd.stproxyon]
desc = 开启代理：把车机 HTTP 代理指向 PC（默认 mitmproxy 8888）
group = 网络模拟
usage = stproxyon <PC_IP:端口>   例：stproxyon 10.41.152.100:8888
run = shell settings put global http_proxy $1

[cmd.stproxyoff]
desc = 关闭代理：三个键一起删，只删一个会留 host/port 残值
group = 网络模拟
usage = stproxyoff
run = shell "settings delete global http_proxy; settings delete global global_http_proxy_host; settings delete global global_http_proxy_port"

[cmd.stweak]
desc = 弱网模拟：tc netem 延迟 / 丢包 / 限速（需 root）
group = 网络模拟
usage = stweak <延迟ms> <丢包%> <速率>   例：stweak 200ms 5% 1mbit
run = shell "su 0 tc qdisc replace dev wlan0 root netem delay $1 loss $2 rate $3"

# T3（2026-11-19）：上下行都清。只删 root 的话 ingress 镜像还挂着，
# 下行仍在走 ifb0 的 netem —— 表现为"关了弱网，下行还是慢"。
[cmd.stweakoff]
desc = 关闭弱网：删除 tc root 与 ingress/ifb 规则，恢复原网络
group = 网络模拟
usage = stweakoff
run = shell "su 0 tc qdisc del dev wlan0 root; su 0 tc qdisc del dev wlan0 ingress; su 0 tc qdisc del dev ifb0 root; su 0 ip link set ifb0 down"

# T3（2026-11-19）：下行弱网。wlan0 出口只能管"从车机发出去"的包，
# 下行必须把 ingress 镜像到 ifb 设备再挂 netem（逆向里 DOWNLOAD_* 是独立一套）。
[cmd.stweakdown]
desc = 下行弱网：ingress 镜像到 ifb0 后限速/延迟/丢包（需 root + ifb 模块）
group = 网络模拟
usage = stweakdown <延迟ms> <丢包%> <速率>
run = shell "su 0 modprobe ifb; su 0 ip link set ifb0 up; su 0 tc qdisc add dev wlan0 handle ffff: ingress 2>/dev/null; su 0 tc filter del dev wlan0 parent ffff: 2>/dev/null; su 0 tc filter add dev wlan0 parent ffff: protocol ip u32 match u32 0 0 action mirred egress redirect dev ifb0; su 0 tc qdisc replace dev ifb0 root netem delay $1 loss $2 rate $3"

[cmd.stweakstat]
desc = 弱网现状回读：tc qdisc + 当前 http_proxy（判断是真生效还是假成功）
group = 网络模拟
usage = stweakstat
run = shell "su 0 tc qdisc show dev wlan0; echo ---IFB---; su 0 tc qdisc show dev ifb0 2>/dev/null; echo ---PROXY---; settings get global http_proxy"

# T3（2026-11-19）：一键还原。三条代理键 + tc 规则必须一起清 ——
# 只删 http_proxy 会留下 global_http_proxy_host/port 残值，下次连网仍走代理。
[cmd.stweakreset]
desc = 一键还原：删 tc qdisc + 三个代理键，回到出厂网络设置
group = 网络模拟
usage = stweakreset
run = shell "su 0 tc qdisc del dev wlan0 root; su 0 tc qdisc del dev wlan0 ingress; su 0 tc qdisc del dev ifb0 root; settings delete global http_proxy; settings delete global global_http_proxy_host; settings delete global global_http_proxy_port"

# ============================================================================
#  网联服务命令（2026-11-15 用户第 2 批需求）
#  这 3 条都是"打开车机上某个后台页"，纯 am start，适合写在 ini 里 ——
#  包名/Activity 变了只改这里，不用重编译。
#  其余 10 条放在内置命令里（:wsalipay / :wswmpf / :wswx / :sxlog / :wsdevid / :url），
#  原因见 TaskCmds.cs 的「网联服务」小节：要控制落点、要等重启、要开浏览器。
# ============================================================================

[cmd.wsconfig]
desc = 配置中心后台：打开 space.syncore.cockpit 配置中心默认页
group = 网联服务
usage = wsconfig
run = shell am start -n space.syncore.cockpit.configcenter/space.syncore.cockpit.configcenter.ui.DefaultConfigDisplayActivity

[cmd.wsalipayset]
desc = 支付宝后台：打开支付宝车载服务的设置页（ampe://setting）
group = 网联服务
usage = wsalipayset
run = shell "am start -a android.intent.action.VIEW -d ampe://setting"

[cmd.wsalipayup]
desc = 上传支付宝日志：触发支付宝把本地日志上传到云端（ampe://uploadlog）
group = 网联服务
usage = wsalipayup
run = shell "am start -a android.intent.action.VIEW -d ampe://uploadlog"

# ============================================================================
#  2026-11-20 第 5 批需求 —— 网联服务：广汽云环境 / PKI 证书
#
#  这 5 条都只有一条命令，放 ini 里改域名不用重编译。
#  带 root 的多步操作（删 PKI 证书文件、切 PKI 证书环境）走内置 : 命令，
#  因为 ini 的一条 run 只能是一行（见 docs/DESIGN.md §4）。
#
#  【setprop 注意】persist.sys.* 是持久属性，重启后仍保留；
#  sys.* 不是持久属性，重启即丢。两条 PKI 切环境命令里混用了两种，
#  这里照用户给的命令原样下发，不做"优化"，避免和固件预期不一致。
# ============================================================================

[cmd.gacpre]
desc = 切广汽云预发布环境：setprop persist.sys.tsp.platform.domain pre-platform-access
group = 网联服务
usage = gacpre
run = shell setprop persist.sys.tsp.platform.domain pre-platform-access.gacicv.com:8443

[cmd.gactest]
desc = 切广汽云测试环境：setprop persist.sys.tsp.platform.domain pv-release
group = 网联服务
usage = gactest
run = shell setprop persist.sys.tsp.platform.domain pv-release.gacicv.com:8080

[cmd.gacquery]
desc = 查询广汽云环境：读 persist.sys.tsp.platform.domain
group = 网联服务
usage = gacquery
run = shell getprop persist.sys.tsp.platform.domain

# 说明：需求 9 / 13 / 14（删 PKI 证书、PKI 切预发布/正式）都是"root + 多步"，
# ini 的一行 run 表达不了，做成了内置命令：
#   :pki del      删 /mnt/vendor/persist/certs/*（内存中删除，重启后恢复 → 必须先 root）
#   :pki pre      切 PKI 预发布（root → 开云 App → setprop 测试域名）
#   :pki prod     切 PKI 正式（root → setprop 三条 sys.pki.*）
# 卡片直接用 : 前缀的命令名，不在这里重复定义，避免"两个入口同一命令"。

