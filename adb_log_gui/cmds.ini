[cmd.stxyoff]
desc = 关闭坐标：pointer_location = 0
group = SynTestUtil
usage = stxyoff
run = shell settings put system pointer_location 0

[cmd.stvin]
desc = 查看 VIN：读 persist.sys.vehicle.vin
group = SynTestUtil
usage = stvin
run = shell getprop persist.sys.vehicle.vin

[cmd.stping]
desc = 网络状态：ping 公网 5 个包（car_net）
group = SynTestUtil
