# ============================================================================
#  cmds.ini — DIY 自定义命令
#
#  格式：[cmd.命令名]，下面跟 desc / group / usage / run
#  run 里可以调用任何已有命令（内置的、adb 的、shell 的、别的自定义命令）
#
#  占位符：
#     $1..$9      位置参数        $*   全部参数原文      $0  命令名
#     $(date)     20261102        $(date-)  2026-11-02
#     $(time)     153012          $(datetime)  2026-11-02 15:30:12
#     $(serial)   设备序列号       $(cur)  当前设备目录
#     $(app)      ini 里的 app 值  $(argc) 参数个数
#
#  【管道注意】写设备侧管道必须用双引号包住整条命令：
#       run = shell "dumpsys meminfo | head -40"     ✓ 设备侧
#       run = shell dumpsys meminfo | head -30       ✗ 会当成本地管道
#
#  【命名注意】别用设备上已有的命令名（kill / clear / ping / ps / top / cat ...），
#  否则会抢掉透传；真要用设备原版就加感叹号，例如 !kill
#
#  【边界】超过 5 行的逻辑请写成 .bat / .ps1，用 type=local 挂进来，不要在这里堆
# ============================================================================

# ---------------- 别名 ----------------
[cmd.l]
desc = 列目录（ls 简写）
group = 别名
run = ls

[cmd.ll]
desc = 详细列表（设备原生 ls -l）
group = 别名
run = ls -l

[cmd.la]
desc = 全部文件含隐藏（设备原生 ls -la）
group = 别名
run = ls -la

# ---------------- 网络 ----------------
[cmd.net]
desc = 已建立的网络连接
group = 网络
run = shell "netstat -anp | grep ESTAB"

[cmd.ports]
desc = 监听中的端口
group = 网络
run = shell "netstat -anp | grep LISTEN"

# ---------------- 应用 ----------------
[cmd.apkinfo]
desc = 包信息（版本 / 路径 / 安装时间）
group = 应用
usage = apkinfo <包名>
run = shell "dumpsys package $1 | grep -E 'versionName|versionCode|codePath|firstInstallTime'"

[cmd.apps]
desc = 第三方应用列表
group = 应用
run = shell pm list packages -3

[cmd.stopapp]
desc = 强杀应用（force-stop）
group = 应用
usage = :stopapp <包名>
run = shell am force-stop $1

[cmd.appclear]
desc = 清除应用数据
group = 应用
usage = appclear <包名>
run = shell pm clear $1

# ---------------- 性能 ----------------
[cmd.cpu]
desc = CPU 占用排行（一次采样）
group = 性能
run = shell "top -n 1 -b | head -25"

[cmd.mem]
desc = 内存总览
group = 性能
run = shell "dumpsys meminfo | head -40"

# ---------------- 日志 ----------------
[cmd.crash]
desc = 崩溃日志缓冲区
group = 日志
run = logcat -d -b crash

[cmd.traces]
desc = 最近一次 ANR 追踪（改名避开内置的 anr 跳转）
group = 日志
run = shell cat /data/anr/traces.txt

[cmd.errors]
desc = 当前日志里的错误行
group = 日志
run = logcat -d *:E

# ---------------- 文件 ----------------
[cmd.df]
desc = 各分区占用（等价 shell df -h）
group = 文件
usage = :df
run = shell df -h

[cmd.big]
desc = 本目录大文件前 12
group = 文件
run = shell "ls -lS | head -12"

# 截图 / 录屏 / HCI 的落点已改为「桌面\logcat\<日期>\<分类>」两级结构：
#   $(out:shot) -> 桌面\logcat\2026-11-10\screencap
#   $(out:rec)  -> 桌面\logcat\2026-11-10\screenrecord
#   $(out:hci)  -> 桌面\logcat\2026-11-10\HCI
# 目录由 $(out:xxx) 在求值时就建好（重定向到不存在的目录会直接失败）。

[cmd.shot]
desc = 一键截图（老路径：cmd 重定向，供 :shot -r 逃生舱）
group = 快捷
usage = :shot -r
run = adb exec-out screencap -p > "$(out:shot)\shot_$(time).png"

# 说明：:shot 默认已改为**内置静默截图**（_cs/TaskCmds.cs 的 DoShotSilent），
#   不再经过 cmd.exe，因此不会弹出 adb 黑窗，落点仍是 桌面\logcat\<今天>\screencap。
#   上面这条 [cmd.shot] 只在 :shot -r / --raw 时走（老的重定向路径），
#   保留给个别 ROM 上 screencap 二进制流异常时兜底。

[cmd.rec]
desc = 一键录屏（单击开始，再单击停止保存到桌面 logcat\日期\screenrecord）
group = 快捷
usage = :rec
run = screenrecord /sdcard/adb_tool_rec_$(date)_$(time).mp4

[cmd.dumpall]
desc = 把当前目录导出到带日期的文件夹
group = 文件
run = pull $(cur) D:\adb_dump\$(date-)

# ---------------- 系统 ----------------
[cmd.sysinfo]
desc = 机型 / 系统版本 / 序列号
group = 系统
run = shell "getprop | grep -E 'ro.product.model|ro.build.version.release|ro.build.version.sdk|ro.serialno'"

[cmd.battery]
desc = 电池状态
group = 系统
run = shell dumpsys battery

[cmd.screen]
desc = 屏幕分辨率与密度（wm size + wm density）
group = 系统
run = shell "wm size; wm density"

[cmd.adbver]
desc = 本机 adb 版本
group = 系统
run = adb version

[cmd.windisp]
desc = 屏幕参数（dumpsys window displays 前 80 行）
group = 系统
run = shell "dumpsys window displays | head -80"

[cmd.aid]
desc = Android ID（单值，settings get secure android_id）
group = 系统
run = shell settings get secure android_id

[cmd.osver]
desc = Android 版本（单值，ro.build.version.release）
group = 系统
run = shell getprop ro.build.version.release

[cmd.devs]
desc = 已连接设备（adb devices 全表）
group = 系统
run = adb devices

[cmd.adbst]
desc = 启动 adb 服务（已在跑则无输出，属正常）
group = 系统
run = adb start-server

[cmd.adbsp]
desc = 停止 adb 服务（会断开日志抓取与投屏，之后需 :r 重连）
group = 系统
run = adb kill-server

[cmd.prop]
desc = 查单个系统属性
group = 系统
usage = prop <属性名>    例：prop ro.build.version.sdk
run = shell getprop $1

# ---------------- 发送 ----------------
[cmd.hello]
desc = 给 App 发一条健康检查
group = 发送
usage = :hello
run = :send healthcheck

# ============================================================================
#  项目快捷指令（v7.1）
#  说明：这里的 run 一律用 shell 前缀 + 双引号包住整条命令，
#        这样管道在引号内 => 走设备侧 grep，不经过本地 cmd，
#        既不会因为设备上没有 findstr 而失败，也不会把 UTF-8 日志按 GBK 解析。
#  若确实要用 Windows 的 findstr，写法是：!adb shell getprop | findstr xxx
# ============================================================================

[cmd.tsp]
desc = 启动 GAC Cloud App 主界面
group = 快捷
usage = :tsp
run = shell am start -n com.gac.cloud.app/.app.MainActivity

[cmd.airec]
desc = AI 智能推荐后台（场景大师 AI 控制）
group = 快捷
usage = :airec
run = shell am start -W com.gxatek.cockpit.scenesengine/com.gxatek.cockpit.scenesengine.aicontrol.activity.MainActivity

[cmd.engmode]
desc = 进入工程模式
group = 快捷
usage = :engmode
run = shell am start -n com.android.engmode/.MainActivity

[cmd.bypassgm]
desc = 绕过国密（设置 TSP 平台域名）
group = 快捷
usage = :bypassgm
run = shell setprop persist.sys.tsp.platform.domain pre-platform-access.gacicv.com

[cmd.uuid]
desc = 查 navi.uuid 属性（要一次看全部九项用 :car）
group = 快捷
usage = :uuid
run = shell "getprop | grep navi.uuid || echo not-found"

[cmd.did]
desc = 查 navi.did 属性（要一次看全部九项用 :car）
group = 快捷
usage = :did
run = shell "getprop | grep navi.did || echo not-found"

# ============================================================================
# 车机信息九项（2026-11-10 新增）
#
#   注：这九项已经做成内置命令 :car（_cs/CarInfo.cs），
#   一次 shell 往返取回全部，输出按列对齐；:car cmd 连命令一起显示。
#   这里是**自定义命令形式**的等价版本，方便你在 cmds.ini 里改口径
#   （比如某个车型的属性名不一样），不用重新编译 exe。
#
#   字段口径（用户指定）：
#     车型值    sys.product.gacvehicleplatform
#     SOC 版本  ro.product.version.short_name
#     MCU 版本  sys.vehicle.mcu.version
#     Android   ro.build.version.release
#     VIN       persist.sys.vehicle.vin
#     UUID      persist.sys.navi.uuid
#     DID       persist.sys.navi.did
#     OPENID    persist.sys.navi.openid
# ============================================================================

[cmd.carinfo]
desc = 车机信息九项（车型/SOC/MCU/Android/VIN/UUID/DID/OPENID/分辨率）
group = 快捷
usage = :carinfo
run = shell "echo 车型; getprop sys.product.gacvehicleplatform; echo SOC; getprop ro.product.version.short_name; echo MCU; getprop sys.vehicle.mcu.version; echo Android; getprop ro.build.version.release; echo VIN; getprop persist.sys.vehicle.vin; echo UUID; getprop persist.sys.navi.uuid; echo DID; getprop persist.sys.navi.did; echo OPENID; getprop persist.sys.navi.openid; echo 分辨率; wm size"

[cmd.openid]
desc = 查 open 相关属性
group = 快捷
usage = :openid
run = shell "getprop | grep open || echo not-found"

[cmd.sid]
desc = 实时过滤日志 20009（Ctrl+C 结束）
group = 快捷
usage = :sid
run = shell "logcat -v time | grep 20009"

[cmd.yes]
desc = 夜间模式 开（需要 root）
group = 快捷
usage = :yes
run = shell "su 0 cmd uimode night yes"

[cmd.no]
desc = 夜间模式 关（需要 root）
group = 快捷
usage = :no
run = shell "su 0 cmd uimode night no"

[cmd.autotheme]
desc = 自动主题模式（跟随系统）
group = 快捷
usage = :autotheme
run = shell "su 0 cmd uimode night auto"

[cmd.hci]
desc = HCI 蓝牙日志导出（btsnoop 到桌面 logcat\日期\HCI）
group = 日志
usage = :hci
run = pull /log/android_log/btsnoop "$(out:hci)"

# ---------------- 方控按键（dumpsys car_service inject-key）----------------
#  说明：这类键值由车机的 CarService 接管，直接注入 InputEvent，
#        等价于真的按了一下方向盘按键 —— 比 input keyevent 更接近实车行为，
#        也不会被系统当成普通按键事件拦掉。
#  用法：adb shell dumpsys car_service inject-key <键值>

[cmd.fkcall]
desc = 方控 通话按键（keycode 503）
group = 方控
usage = fkcall  /  :fkcall
run = shell dumpsys car_service inject-key 503

[cmd.fkvoice]
desc = 方控 语音按键（keycode 508）
group = 方控
usage = fkvoice  /  :fkvoice
run = shell dumpsys car_service inject-key 508

[cmd.fkprev]
desc = 方控 上一首（keycode 506）
group = 方控
usage = fkprev  /  :fkprev
run = shell dumpsys car_service inject-key 506

[cmd.fknext]
desc = 方控 下一首（keycode 507）
group = 方控
usage = fknext  /  :fknext
run = shell dumpsys car_service inject-key 507

[cmd.fkplay]
desc = 方控 播放 / 暂停（keycode 522）
group = 方控
usage = fkplay  /  :fkplay
run = shell dumpsys car_service inject-key 522

[cmd.fkvolup]
desc = 方控 音量 +（keycode 513）
group = 方控
usage = fkvolup  /  :fkvolup
run = shell dumpsys car_service inject-key 513

[cmd.fkvoldown]
desc = 方控 音量 -（keycode 514）
group = 方控
usage = fkvoldown  /  :fkvoldown
run = shell dumpsys car_service inject-key 514

[cmd.fkmute]
desc = 方控 静音（keycode 521）
group = 方控
usage = fkmute  /  :fkmute
run = shell dumpsys car_service inject-key 521

[cmd.fksource]
desc = 方控 星号键（keycode 520）
group = 方控
usage = fksource  /  :fksource
run = shell dumpsys car_service inject-key 520

# 注意：520 的语义在 2026-11-12 按真机脚本修正为「星号键」。
# 旧版本标成「音源切换」是错的 —— 用户提供的实车脚本里
# 520 用于星号键，且与 503 组合按下可触发强制重启。
# 命令名 fksource 保留不改，避免破坏已有历史记录与肌肉记忆。

# ---------------- 手车互联（2026-11-12）----------------
#  CarPlay 认证属性与 HiCar 相关操作。
#
#  【重要】下面几条 carplaycert / hicarclear / fkforce 都**没有**在这里定义，
#  它们是内置命令（_cs/Prefix.cs + TaskCmds.cs），因为需要额外逻辑：
#    :carplaycert  设完要 getprop 回读确认（setprop 可能假成功）
#    :hicarclear   走 hdc 通道，不是 adb
#    :fkforce      要分段下发 down/按住/up，且失败要回滚按键状态
#  cmds.ini 的模板机制只能展开一条静态命令，做不到这些，
#  写在这里也会被内置分支抢先命中，变成永远不执行的死配置。
#
#  想在界面上看到它们，看「手车互联」和「方控按键」两个快捷指令分组。

# ============================================================================
#  SynTestUtil 复用命令（2026-11-14）
#  证据：SynTestUtil/log/polaris-info.log 的 13 条实测 adb 命令
#        + 项目内 SynTestUtil 两份逆向文档
#  约定：命令名统一 st 前缀，避免与已有内置命令 / 设备原生命令抢名。
#        逐条证据、用法、未确认项见 docs/SynTestUtil命令对照与用法.md
# ============================================================================

[cmd.stlogall]
desc = 抓全日志：导出 logcat 当前缓冲最近 2000 行（-v time）
