# ============================================================================
#  adb_log_export.ini — 配置文件
#  把本文件与 adb_log_export.exe 放在同一目录，改完无需重新编译。
#  以 # 或 ; 开头的行为注释。
# ============================================================================

# ---------------- 设备与连接 ----------------

# adb 可执行文件路径（默认用 PATH 里的 adb；路径带空格时直接写完整路径即可）
adb=adb

# 设备序列号：多台设备时必须指定，否则工具无法判断用哪一台
serial=

# 连接时自动获取 root：1=开启 0=关闭
# 提示：只发消息不需要 root；root 会让 adbd 重启，略微打断连接
auto_root=1

# 设备掉线自动探测：1=开启 0=关闭
watch_dev=1

# 重连尝试次数
reconn_try=5

# 单条 adb 命令的超时（毫秒，0=不限制）。防止设备异常/系统唤醒后
# adb 卡在失效的 USB 句柄上，把整个界面一起拖死。传大文件不受影响。
timeout_ms=30000

# 后台探活单次上限（毫秒）。太小会在慢机器上误判"超时"，
# 太大会让"设备掉了"发现得慢；4000 是实测比较稳的值。
probe_ms=4000

# 控制台 QuickEdit（1=开，0=关），默认开。
#   开：鼠标滚轮上滑看历史、拖选文字 + 回车/右键复制、右键粘贴 都可用。
#   关：鼠标不再抢焦点（误点也不会假死），但上滑/复制/粘贴也一起没了。
# 本工具另外自带 Ctrl+V / Shift+Insert 粘贴，不依赖这一项。
quick_edit=1

# ---------------- 日志浏览 ----------------

# 设备上的默认起始目录（adb 原始位置）
# 2026-11-11 改：不再默认进 /log/android_log/androidlog，
# 想进日志目录用 logs 命令（jump_log 仍指向日志根）。
root=/

# 快捷跳转目标：res / logs / anr / dropbox 命令对应的目录
jump_res=/iflytek_a/iflytek/res
jump_log=/log/android_log/androidlog
jump_anr=/data/anr
jump_dropbox=/data/system/dropbox

# ls 排版：每行最多列数 / 列间隔（空格数）/ 兜底窗口宽度
ls_maxcol=10
ls_gap=3
ls_width=100

# ls 着色：1=目录显示青色 0=纯文本（终端颜色异常时改 0）
ls_color=1

# 整体着色总开关：1=开启 0=关闭（全部改为灰色，适合浅色背景/录屏）
color=1

# 终端主题：dark=黑底终端（默认）  light=白底终端
# 白底时辅助色改成 Gray、强调色改成暗色调，否则 DarkGray 几乎看不见
theme=light
# 强调色：red/yellow/blue/white/purple/black/green/orange/pink（按钮/进度条/选中态）
accent=purewhite

# 输入模式：
#   edit = 编辑模式（方向键 / Tab / 历史可用，但打不了中文）
#   ime  = 中文模式（输入法可用，但没有方向键）
#   auto = 跟随系统输入法状态：检测到中文就自动用中文模式，切回英文就恢复编辑
# 根因：ReadKey 走 ReadConsoleInput，绕过输入法组字，中文只会出字母；
#       ReadLine 走 ReadConsole，输入法能用，但拿不到方向键。两者不可兼得。
# 运行时随时切换：:ime（下一条）  :ime on  :ime off  :ime auto
input=edit

# 旧裸名兼容：1=send / ver / now / test 等旧命令继续可用（每个只提示一次）
#            0=彻底关闭，裸名全部还给设备（更纯粹，但旧脚本要改成 : 前缀）
legacy_alias=1

# 动作回显：1=显示"工具把这条输入理解成了什么"，0=关闭
# 例：→ shell   df -h
echo_action=1

# cd 之后是否自动列目录：1=列 0=只提示（长目录列表会冲掉上下文时改 0）
cd_ls=1

# 提示符显示什么：
#   dev   设备号 + 目录（默认）。停在 root 目录时只显示设备号
#            ef2e593d >                  在 ini 的 root 目录上
#            ef2e593d:/data/anr >        cd 进了别的目录
#            ef2e593d:…/androidlog/288 > 路径太长，压成末两段（…/ 表示前面还有）
#   id    只显示设备号
#   path  只显示目录（v7.13 及更早的老样式）
# 完整路径始终在标题栏，不受这里影响。
prompt=dev

# 等待指示阈值（毫秒）：超过该时长才显示 "..."，0=关闭
# 设小会闪烁，设大会显得卡顿，300 是经验值
wait_hint_ms=300

# 导出时平铺（1=不套同名目录，直接铺进目标路径；0=末段同名才铺，否则套一层）
export_flat=0

# 导出目录时自动打包成 tar.gz
#   0 = 不打包，逐文件拉取
#   1 = 总是打包
#   2 = 文件数达到 export_zip_min 才打包（推荐）
# 为什么打包更快：小文件多时 adb 是逐个传的，每个文件都有协议往返；
# 设备端 tar 成 1 个文件再 pull，通常快一个数量级。
# 解压：7-Zip / WinRAR / tar -xzf 都行。
export_zip=2
export_zip_min=100

# 导出到"已存在且非空"的目录时：不询问，自动改用 目标_时间戳 新目录（绝不覆盖）

# ---------------- 发送到 App（中文意图）----------------

# 意图 action 与 URI 前缀（换接口只改这两行）
action=android.intent.action.VIEW
uri_prefix=sr://syncore.vpa.sr/test?text=

# am 子命令：startservice / start / start-foreground-service
# 遇到 "not allowed to start service"（Android 8+ 后台限制）时改成 start-foreground-service
am_cmd=startservice

# 显式组件：形如 com.pkg/.Svc 或 com.pkg/com.pkg.Svc
# 留空则只靠 uri_prefix 的 scheme 匹配；填了就会加 -n，可绕过 scheme 未匹配的问题
component=

# 单条发送失败后自动重试次数：0 表示不重试
retry=1

# 批量发送遇到失败时：0=跳过继续（推荐，最后给失败清单）  1=立即停止
batch_stop_on_error=0

# 常用语 1~9：填中文即可；留空表示该编号不可用
# 用法：send 1  ~  send 9
quick_1=
quick_2=
quick_3=
quick_4=
quick_5=
quick_6=
quick_7=
quick_8=
quick_9=

# ---------------- 自定义命令（DIY）----------------

# 目标 App 包名，供 cmds.ini 里 $(app) 占位符使用
# 例：app=com.iflytek.xxx
app=
# 自定义命令定义在同目录 cmds.ini，格式见该文件头部说明

# ---------------- 批量版本查询 ----------------

# 输入 ver 时一次性查询这些包的版本（一次 adb 调用查全部，很快）
# 格式：逗号分隔，可写 包名=别名，别名会显示在结果里
# 例：version_pkgs=com.gxatek.cockpit.scenesengine=座舱,com.x.voice=语音
# 也可临时指定：ver com.a.b com.c.d
version_pkgs=

# ---------------- 环境切换 ----------------

# 三个属性的名字（换项目只改这里）
env_prop_deploy=persist.sys.autofly.web.deploy
env_prop_https=persist.sys.autofly.web.https
env_prop_domain=persist.sys.autofly.web.domain

# 各环境的取值：env_环境名=deploy值;https值;domain值
#   test / pre / dev   切换环境（设置后立即回读校验）
#   syncore            查询当前值，并自动识别属于哪套环境
# 注意：test 会占用设备 shell 自带的 test 命令，要用原版请写 !test
env_test=test;api-test.syncore.space:20443;api-test.syncore.space:20443
env_pre=pre;api-pre.syncore.space:20443;api-pre.syncore.space:20443
env_dev=dev;api.syncore.space;api.syncore.space

# ---------------- 语音助手调试（:vr）----------------
# 融合自「语音助手工具.exe」的讯飞语音调试能力，用法见 :vr help

# 语助应用包名（版本查询 / 卸载 / 强杀 / 调试页都依赖它）
vr_pkg=com.iflytek.cutefly.speechclient.hmi

# 唤醒 URI（不带 query）
vr_vr_uri=vr://com.iflytek.autofly.vr/interaction/start
# 唤醒 type：新文档写 1；原工具实测用 99（并附加 canSleep=false）
vr_wake_type=1
vr_wake_type_alt=99

# 识别 URI 前缀（文本会被 URL 编码后追加在后面）
vr_sr_uri=sr://syncore.vpa.sr/test?text=

# 单条识别文本上限（字）：原工具限 50，超过设备侧会丢字
vr_text_max=50

# 旧版文本语义服务（:vr ts 走这条，作为 sr:// 不可用时的兜底）
vr_ts_service=com.iflytek.auto.speechclient.sdk.TextSemanticService
vr_ts_package=com.example.package
prefs=eyJmb250Ijoic3lzdGVtIiwiY3VzdG9tIjoiIiwic2l6ZSI6InMifQ==
